[project]
name = "rd-tools"
version = "1.0.0"
description = "Operational CLI tools for ruidong-agent-core (dump traces, etc.)"
requires-python = ">=3.12"
dependencies = [
    "rd-replay-evals",
    "psycopg2-binary>=2.9",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rd_tools"]
