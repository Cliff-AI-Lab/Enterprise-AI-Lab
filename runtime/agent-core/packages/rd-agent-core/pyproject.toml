[project]
name = "rd-agent-core"
version = "0.1.3"
description = "Host-neutral agent runtime kernel and business adapter contracts"
requires-python = ">=3.12"
dependencies = [
    "rd-agent-contracts>=1.14.1,<2.0.0",
    "rd-llm-adapter>=1.1.2,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rd_agent_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
