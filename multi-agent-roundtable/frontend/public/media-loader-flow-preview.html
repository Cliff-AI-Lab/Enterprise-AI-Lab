<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TelegramAgent Media Loader Flow Preview</title>
    <style>
      :root {
        --bg: oklch(96.4% 0.018 240);
        --surface-solid: oklch(99.1% 0.006 240);
        --surface-subtle: oklch(97.1% 0.014 240);
        --text: oklch(24% 0.04 245);
        --muted: oklch(48% 0.045 245);
        --accent: oklch(58% 0.15 245);
        --accent-soft: oklch(94% 0.04 245);
        --line: oklch(43% 0.055 245 / 0.14);
        --shadow-soft: 0 8px 26px oklch(38% 0.08 245 / 0.09);
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% -10%, oklch(99.4% 0.004 240 / 0.86), transparent 34%),
          linear-gradient(135deg, oklch(97.8% 0.015 240), var(--bg) 54%, var(--surface-solid));
        color: var(--text);
      }

      .preview-wrap {
        width: min(680px, calc(100vw - 32px));
        display: grid;
        gap: 14px;
      }

      .bubble {
        width: fit-content;
        max-width: 100%;
        padding: 16px 18px;
        border: 1px solid oklch(57% 0.12 245 / 0.14);
        border-radius: 18px 18px 18px 6px;
        background: oklch(99.2% 0.006 240 / 0.96);
        box-shadow: var(--shadow-soft);
      }

      .bubble p {
        margin: 0 0 12px;
        font-size: 15px;
        line-height: 1.55;
      }

      .generated-media-card {
        position: relative;
        display: grid;
        width: min(360px, 100%);
        aspect-ratio: 1 / 1;
        overflow: hidden;
        place-items: end start;
        padding: 14px;
        border: 1px solid color-mix(in oklch, var(--accent) 16%, transparent);
        border-radius: 12px;
        background: var(--surface-subtle);
        color: var(--muted);
        font-size: 12px;
        font-weight: 760;
        box-shadow:
          inset 0 0 0 1px oklch(100% 0 0 / 0.46),
          0 16px 32px oklch(38% 0.08 245 / 0.1);
      }

      .generated-media-card.generating {
        background:
          radial-gradient(circle at 32% 24%, color-mix(in oklch, var(--accent) 20%, transparent), transparent 26%),
          linear-gradient(135deg, var(--surface-subtle), color-mix(in oklch, var(--accent-soft) 54%, var(--surface-solid)));
      }

      .shadow-dots {
        position: absolute;
        inset: 0;
        overflow: hidden;
        opacity: 0.62;
        filter: blur(0.1px);
        pointer-events: none;
      }

      .shadow-dots span {
        position: absolute;
        width: var(--size);
        height: var(--size);
        border-radius: 999px;
        background: color-mix(in oklch, var(--accent) 48%, var(--surface-solid));
        box-shadow:
          0 0 10px color-mix(in oklch, var(--accent) 18%, transparent),
          0 8px 18px oklch(38% 0.08 245 / 0.08);
        opacity: 0;
        transform: translate3d(var(--x), var(--y), 0) scale(0.72);
        animation: float-dot var(--duration) var(--ease-in-out) infinite;
        animation-delay: var(--delay);
      }

      .shadow-dots span:nth-child(1) {
        --x: 42px;
        --y: 242px;
        --size: 5px;
        --delay: 0s;
        --duration: 4.8s;
      }

      .shadow-dots span:nth-child(2) {
        --x: 112px;
        --y: 290px;
        --size: 4px;
        --delay: 0.55s;
        --duration: 5.6s;
      }

      .shadow-dots span:nth-child(3) {
        --x: 188px;
        --y: 232px;
        --size: 6px;
        --delay: 1.05s;
        --duration: 5.2s;
      }

      .shadow-dots span:nth-child(4) {
        --x: 274px;
        --y: 280px;
        --size: 4px;
        --delay: 1.6s;
        --duration: 5.9s;
      }

      .shadow-dots span:nth-child(5) {
        --x: 234px;
        --y: 92px;
        --size: 4px;
        --delay: 2.15s;
        --duration: 5.4s;
      }

      .shadow-dots span:nth-child(6) {
        --x: 92px;
        --y: 112px;
        --size: 3px;
        --delay: 2.7s;
        --duration: 5.8s;
      }

      .soft-shadow-flow {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 66%;
        height: 66%;
        border-radius: 999px;
        background: radial-gradient(
          circle at 50% 50%,
          oklch(58% 0.15 245 / 0.18) 0%,
          oklch(70% 0.11 220 / 0.13) 34%,
          transparent 68%
        );
        opacity: 0.46;
        filter: blur(24px);
        transform: translate(-50%, -50%) scale(0.38);
        transform-origin: 50% 50%;
        animation: shadow-flow 4.8s var(--ease-in-out) infinite;
        pointer-events: none;
      }

      .generated-media-shimmer {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          110deg,
          transparent 0%,
          color-mix(in oklch, var(--surface-solid) 56%, transparent) 42%,
          transparent 72%
        );
        transform: translateX(-100%);
        animation: media-shimmer 1.35s var(--ease-in-out) infinite;
      }

      .loader-copy {
        position: relative;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 28px;
        padding: 7px 10px;
        border-radius: 10px;
        background: color-mix(in oklch, var(--surface-solid) 68%, transparent);
        box-shadow:
          0 8px 20px oklch(38% 0.08 245 / 0.08),
          inset 0 0 18px oklch(100% 0 0 / 0.38);
      }

      .loader-copy::after {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow:
          12px 0 0 color-mix(in oklch, var(--accent) 54%, transparent),
          24px 0 0 color-mix(in oklch, var(--accent) 28%, transparent);
        animation: dot-trail 1.1s var(--ease-out) infinite;
      }

      .note {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }

      @keyframes media-shimmer {
        to {
          transform: translateX(100%);
        }
      }

      @keyframes shadow-flow {
        0%,
        100% {
          opacity: 0.3;
          transform: translate(-50%, -50%) scale(0.38);
        }
        50% {
          opacity: 0.72;
          transform: translate(-50%, -50%) scale(1);
        }
      }

      @keyframes float-dot {
        0%,
        100% {
          opacity: 0;
          transform: translate3d(var(--x), var(--y), 0) scale(0.7);
        }
        18% {
          opacity: 0.42;
        }
        54% {
          opacity: 0.78;
          transform: translate3d(calc(var(--x) + 18px), calc(var(--y) - 28px), 0) scale(1);
        }
        82% {
          opacity: 0.18;
        }
      }

      @keyframes dot-trail {
        0%,
        100% {
          opacity: 0.38;
          transform: translateX(0);
        }
        48% {
          opacity: 1;
          transform: translateX(3px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .generated-media-shimmer,
        .soft-shadow-flow,
        .shadow-dots span,
        .loader-copy::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="preview-wrap">
      <section class="bubble">
        <p>保持原来的生成中卡片，只让阴影和小光点轻轻流动。</p>
        <div class="generated-media-card generating" role="status" aria-label="图片生成中">
          <div class="soft-shadow-flow" aria-hidden="true"></div>
          <div class="shadow-dots" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
          <span class="generated-media-shimmer" aria-hidden="true"></span>
          <span class="loader-copy">努力画图中</span>
        </div>
      </section>
      <p class="note">预览：原版 shimmer + 更轻的流动阴影点，不使用纸张/铅笔画风。</p>
    </main>
  </body>
</html>
