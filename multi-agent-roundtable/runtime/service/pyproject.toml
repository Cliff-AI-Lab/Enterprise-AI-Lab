[project]
name = "roundtable-runtime"
version = "0.1.0"
description = "温氏虚拟圆桌会议 — Python 专家运行时（基于 ruidong-agent-core，直连 iruidong，多模型）"
requires-python = ">=3.12"
dependencies = [
    "rd-agent-contracts",
    "rd-agent-core",
    "rd-llm-adapter",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[tool.uv.sources]
rd-agent-contracts = { path = "../agent-core/packages/rd-agent-contracts", editable = true }
rd-agent-core = { path = "../agent-core/packages/rd-agent-core", editable = true }
rd-llm-adapter = { path = "../agent-core/packages/rd-llm-adapter", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
