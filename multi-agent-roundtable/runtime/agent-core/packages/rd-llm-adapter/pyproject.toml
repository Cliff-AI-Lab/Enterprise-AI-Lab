[project]
name = "rd-llm-adapter"
version = "1.1.2"
description = "LLM provider adapter layer (low-level: protocols + adapters + parser sessions)"
requires-python = ">=3.12"
dependencies = [
    "rd-agent-contracts>=1.14.1,<2.0.0",
]

[project.optional-dependencies]
anthropic-transport = [
    "httpx>=0.27",
]
openai-transport = [
    "openai>=2.0",
]
transport = [
    "httpx>=0.27",
    "openai>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rd_llm_adapter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
