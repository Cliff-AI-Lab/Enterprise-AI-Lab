[project]
name = "rd-replay-evals"
version = "1.0.0"
description = "Stream recorder + golden trace replay engine"
requires-python = ">=3.12"
dependencies = [
    "rd-agent-contracts",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rd_replay_evals"]
